name: CI

# 화면을 열지 않는 검사만 돕니다. 화면은 사람이 시뮬레이터·폰으로 봅니다.
# 세 묶음은 서로 기다리지 않고 함께 돕니다.
#   flutter    — 앱 코드: 형식·정적 분석·생성 코드 최신·단위/위젯 테스트·설정 파일 대조·계측 검사·디버그 빌드
#   functions  — 서버 함수: 린트·빌드·단위 테스트
#   rules      — 보안 규칙 테스트: 이 저장소에서 에뮬레이터를 쓰는 유일한 자리
# 각 묶음은 해당 파일이 아직 없으면(앱 뼈대를 만들기 전 등) 검사할 것이 없어 통과로 끝납니다.
#
# 여기서 돌지 않는 검사와 이유:
#   - 골든 테스트: 운영체제마다 글자 그림이 달라, 기준 그림을 만든 이 맥에서만 돌립니다.
#   - 실서비스 빌드(앱 번들): 업로드 키가 CI에 없습니다. store-release가 이 맥에서 만듭니다.
#   - 기기 통합 테스트: 기기(시뮬레이터·폰)가 있어야 합니다. done-task 전에 이 맥에서 돌립니다.
#   - 디자인 규칙 검사: 걸린 줄을 남길지 판정을 메인이 합니다.
# CI는 Firebase에 아무것도 배포하지 않습니다. 실서비스 배포는 backend-release가 main에서 합니다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 앱 여부 확인
        id: app
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "pubspec.yaml 없음 — 앱 뼈대를 만들기 전이라 Flutter 검사를 건너뜀 (통과)"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          # Flutter 판의 정본은 .fvmrc입니다. 「stable 최신」으로 두면 CI만 판이 앞서가
          # 내 컴퓨터와 빌드가 어긋납니다(이전 앱에서 확인한 교훈).
          if [ ! -f .fvmrc ]; then
            echo "::error::.fvmrc가 없습니다 — 2-0 개발환경 준비가 Flutter 판을 .fvmrc에 적습니다"
            exit 1
          fi
          v=$(jq -r '.flutter // empty' .fvmrc)
          if [ -z "$v" ]; then
            echo "::error::.fvmrc에서 flutter 판을 읽지 못했습니다"
            exit 1
          fi
          echo "flutter_version=$v" >> "$GITHUB_OUTPUT"
          grep -q 'build_runner' pubspec.yaml && echo "codegen=true" >> "$GITHUB_OUTPUT" || echo "codegen=false" >> "$GITHUB_OUTPUT"
          [ -d test ] && echo "has_test=true" >> "$GITHUB_OUTPUT" || echo "has_test=false" >> "$GITHUB_OUTPUT"
          [ -f lib/main_dev.dart ] && echo "has_dev=true" >> "$GITHUB_OUTPUT" || echo "has_dev=false" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.app.outputs.flutter_version }}
          channel: stable
          cache: true

      - if: steps.app.outputs.present == 'true'
        run: flutter pub get

      - name: 형식
        if: steps.app.outputs.present == 'true'
        run: dart format --output=none --set-exit-if-changed .

      # 정적 분석은 테스트와 따로 언제나 돌립니다 — flutter test는 테스트가 불러오지 않는
      # 파일의 오류를 잡지 못합니다(이전 앱에서 확인한 교훈).
      - name: 정적 분석(린트·타입)
        if: steps.app.outputs.present == 'true'
        run: flutter analyze

      # 생성 코드(Riverpod 등)를 다시 만들어 보고, 올라간 것과 다르면 실패합니다.
      # 다르다는 것은 누군가 생성을 빼먹고 올렸다는 뜻입니다.
      - name: 생성 코드 최신 확인
        if: steps.app.outputs.present == 'true' && steps.app.outputs.codegen == 'true'
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::생성 코드가 최신이 아닙니다 — fvm dart run build_runner build 를 돌려 함께 올리세요"
            exit 1
          fi

      - name: 단위·위젯 테스트(골든 제외)
        if: steps.app.outputs.present == 'true' && steps.app.outputs.has_test == 'true'
        run: flutter test --exclude-tags golden

      # 개발용·실서비스용 설정 파일 세 개(Dart 옵션·google-services.json·GoogleService-Info.plist)의
      # 프로젝트 ID가 .firebaserc의 dev·prod 별칭과 같은지 대조합니다(잘못 붙는 사고 방지).
      # 계측 검사는 정의된 이벤트 함수마다 부르는 곳이 있는지 봅니다(정의만 하고 안 부르는 사고 방지).
      # 스크립트는 앱 뼈대 틀이 만들어 두고, 있을 때만 돕니다.
      - name: Firebase 설정 파일 대조
        if: steps.app.outputs.present == 'true'
        run: |
          if [ -f tool/check_firebase_config.dart ]; then
            dart run tool/check_firebase_config.dart
          else
            echo "tool/check_firebase_config.dart 없음 — 건너뜀"
          fi

      - name: 계측 정의·호출 검사
        if: steps.app.outputs.present == 'true'
        run: |
          if [ -f tool/check_analytics_events.dart ]; then
            dart run tool/check_analytics_events.dart
          else
            echo "tool/check_analytics_events.dart 없음 — 건너뜀"
          fi

      # 디버그 빌드는 개발용 flavor로 합니다. 업로드 키가 없으면 Gradle 설정이 debug 서명으로
      # 빌드하므로 CI에서도 됩니다. 안드로이드 빌드 도구(Gradle)가 쓰는 자바를 먼저 깝니다.
      - if: steps.app.outputs.present == 'true' && steps.app.outputs.has_dev == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 디버그 빌드(개발용)
        if: steps.app.outputs.present == 'true' && steps.app.outputs.has_dev == 'true'
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 서버 함수 여부 확인
        id: fn
        run: |
          if [ -f functions/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "functions/package.json 없음 — 서버 함수가 생기기 전이라 건너뜀 (통과)"
          fi

      # Node 판의 정본은 저장소 최상위 .nvmrc입니다.
      - if: steps.fn.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 린트·빌드·단위 테스트
        if: steps.fn.outputs.present == 'true'
        working-directory: functions
        run: |
          npm ci
          for s in lint build test; do
            if npm run | grep -q "^  $s$"; then npm run "$s"; else echo "$s 스크립트 없음 — 건너뜀"; fi
          done

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 보안 규칙 테스트만은 CI 안에서 Firestore·Storage 에뮬레이터를 잠깐 띄워 돌립니다.
      # 공식 규칙 테스트 도구(@firebase/rules-unit-testing)가 에뮬레이터 위에서만 돌고,
      # 로그인한 척을 흉내 낼 수 있는 것도 이 도구뿐이라서입니다. 개발 흐름(내 컴퓨터)에서는
      # 에뮬레이터를 쓰지 않습니다.
      # 프로젝트는 demo- 로 시작하는 가짜 ID를 씁니다 — 에뮬레이터가 실제 Firebase에
      # 닿지 않는 데모 프로젝트로 다루므로, 로그인도 키도 필요 없습니다.
      - name: 규칙 테스트 여부 확인
        id: rt
        run: |
          if [ ! -f rules-test/package.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "rules-test/package.json 없음 — 보안 규칙 테스트가 생기기 전이라 건너뜀 (통과)"
            exit 0
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::최상위 package-lock.json이 없습니다 — Firebase CLI는 최상위 package.json의 개발 의존성으로 판을 고정합니다"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          only="firestore"
          [ -f storage.rules ] && only="firestore,storage"
          echo "only=$only" >> "$GITHUB_OUTPUT"

      - if: steps.rt.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 에뮬레이터는 자바 위에서 돕니다.
      - if: steps.rt.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 보안 규칙 테스트(에뮬레이터)
        if: steps.rt.outputs.present == 'true'
        run: |
          npm ci
          npm --prefix rules-test ci
          npx firebase emulators:exec \
            --only "${{ steps.rt.outputs.only }}" \
            --project demo-rules-test \
            "npm --prefix rules-test test"
